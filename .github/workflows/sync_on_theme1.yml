name: Mirroring

on: [push, delete]

jobs:
  to_theme1:
    runs-on: ubuntu-latest
    steps:                                             
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:maurelK/Theme1.git
          ssh_private_key:                              
            ${{ secrets.THEME1_SSH_PRIVATE_KEY }}
