name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: theme1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/theme1_test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            theme1/deps
            theme1/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('theme1/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install deps
        working-directory: theme1
        run: mix deps.get

      - name: Compile (warnings as errors)
        working-directory: theme1
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: theme1
        run: mix test

  # ─────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: theme2/package-lock.json

      - name: Install dependencies
        working-directory: theme2
        run: npm ci

      - name: Build
        working-directory: theme2
        run: npm run build