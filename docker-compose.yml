services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-theme1_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./theme1
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-theme1_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    entrypoint: ["/app/bin/theme1"]
    command: ["eval", "Theme1.Release.migrate()"]
    restart: "no"

  backend:
    build:
      context: ./theme1
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      PORT: "4000"
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-theme1_dev}
      POOL_SIZE: "10"
      DNS_CLUSTER_QUERY: ""
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./theme2
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata: