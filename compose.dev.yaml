name: theme1-dev
services:
  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theme1_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theme1_dev
    ports:
      - "5433:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
volumes:
  db_dev_data:
